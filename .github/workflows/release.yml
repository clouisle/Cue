name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: >-
          tar -C target/${{ matrix.target }}/release -czf
          cue-${{ matrix.target }}.tar.gz cue
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -LiteralPath target/${{ matrix.target }}/release/cue.exe
          -DestinationPath cue-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cue-${{ matrix.target }}
          path: cue-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cue-*
          merge-multiple: true
          path: release
      - name: Create checksum manifest
        run: (cd release && sha256sum cue-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cue ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
