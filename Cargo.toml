[package]
name = "cue"
version = "0.1.0"
edition = "2024"
description = "One-command service orchestrator driven by .cue.json, with docker-compose style logs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "signal",
    "sync",
    "time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
libc = "0.2"
